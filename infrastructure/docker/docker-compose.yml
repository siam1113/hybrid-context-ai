services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: hybrid, POSTGRES_PASSWORD: hybrid, POSTGRES_DB: hybrid_context }
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports: ["6333:6333"]
  neo4j:
    image: neo4j:5.23-community
    environment: { NEO4J_AUTH: neo4j/hybrid-context }
    ports: ["7474:7474", "7687:7687"]
  temporal:
    image: temporalio/auto-setup:1.24
    ports: ["7233:7233"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
